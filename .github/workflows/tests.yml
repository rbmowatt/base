name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: [11, 12, 13]
        include:
          - laravel: 11
            testbench: '^9.0'
          - laravel: 12
            testbench: '^10.0'
          - laravel: 13
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The model tests build a real schema, so pdo_sqlite is not optional.
          extensions: pdo_sqlite, sqlite3
          coverage: none

      # composer.lock is gitignored (this is a library, not an app), so the cache
      # key hashes composer.json instead and the restore-key lets a near-miss reuse
      # most of the download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - run: composer validate --strict

      # Pinning testbench is what pins the framework: testbench 9 pulls Laravel 11,
      # 10 pulls 12, 11 pulls 13. The illuminate/* constraints then resolve to match.
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - run: composer update --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/phpunit

  static-analysis:
    name: phpstan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: composer-phpstan-

      # No lock file to install from, and larastan needs the framework resolved
      # to read Laravel's own types, so this is an update rather than an install.
      - run: composer update --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/phpstan analyse --no-progress
