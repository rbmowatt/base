name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The model tests build a real schema, so pdo_sqlite is not optional.
          extensions: pdo_sqlite, sqlite3
          coverage: none

      # composer.lock is gitignored (this is a library, not an app), so the cache
      # key hashes composer.json instead and the restore-key lets a near-miss reuse
      # most of the download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/phpunit
